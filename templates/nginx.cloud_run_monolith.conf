# Cloud Run: public PORT → nginx. Serverpod API/WS on 127.0.0.1:8081.
#
# Flutter --wasm emits main.dart.mjs + main.dart.wasm. Alpine nginx has no
# .mjs in mime.types → application/octet-stream → browsers reject the module
# ("Expected a JavaScript-or-Wasm module script"). Set types via default_type
# (not add_header Content-Type — that stacks and breaks .wasm too).
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream serverpod {
    server 127.0.0.1:8081;
}

server {
    listen 8080;
    server_name _;
    root /app/public;
    gzip on;
    # Compress wasm/mjs when client accepts (often large).
    gzip_types
        text/plain
        text/css
        application/javascript
        text/javascript
        application/json
        application/wasm
        application/octet-stream;
    index index.html;

    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;

    # dart2wasm ES module (flutter build web --wasm)
    location ~* \.mjs$ {
        types { }
        default_type text/javascript;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        try_files $uri =404;
    }

    # CanvasKit / skwasm / main.dart.wasm
    location ~* \.wasm$ {
        types { }
        default_type application/wasm;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Entry points must revalidate — stale bundles bake wrong SERVER_URL.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        try_files $uri =404;
    }
    location = /flutter_bootstrap.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        try_files $uri =404;
    }
    location = /flutter.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        try_files $uri =404;
    }
    location = /main.dart.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        try_files $uri =404;
    }
    location = /flutter_service_worker.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        try_files $uri =404;
    }
    location = /version.json {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        try_files $uri =404;
    }

    # Explicit API / realtime — never static.
    location ~ ^/(greeting|websocket|v1)(/|$) {
        proxy_pass http://serverpod;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }

    location / {
        try_files $uri $uri/ @serverpod;
    }

    location @serverpod {
        proxy_pass http://serverpod;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}
