# Cloud Run: public PORT → nginx. Serverpod API/WS on 127.0.0.1:8081.
# Matches podfly_examples/gcp/realtime_monolith pattern.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 8080;
    server_name _;
    root /app/public;
    gzip on;
    index index.html;

    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;

    # Static Flutter assets when the file exists; otherwise Serverpod (API/WS).
    location / {
        try_files $uri $uri/ @serverpod;
    }

    location @serverpod {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}
